<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>週次インサイト</title>
<style>
  :root{
    --ground:#FBFAF8; --card:#FFFFFF; --line:#E8E4DC; --ink:#1E1C19; --muted:#6C665C;
    --faint:#9A9389; --accent:#7A5C2E;
    --sans: system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{--ground:#14130F; --card:#1C1A16; --line:#2E2A24; --ink:#EDE9E1;
      --muted:#A79F93; --faint:#7C7468; --accent:#C9A468;}
  }
  :root[data-theme="light"]{--ground:#FBFAF8; --card:#FFFFFF; --line:#E8E4DC;
    --ink:#1E1C19; --muted:#6C665C; --faint:#9A9389; --accent:#7A5C2E;}
  :root[data-theme="dark"]{--ground:#14130F; --card:#1C1A16; --line:#2E2A24;
    --ink:#EDE9E1; --muted:#A79F93; --faint:#7C7468; --accent:#C9A468;}
  *{box-sizing:border-box} body{margin:0}
  html{-webkit-text-size-adjust:100%}
  .wrap{background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:16px;
    line-height:1.85;padding:2rem 1.15rem 4rem;min-height:100vh}
  .inner{max-width:34rem;margin:0 auto}
  h1{font-size:1.35rem;margin:0 0 .3rem;line-height:1.5}
  .sub{color:var(--muted);font-size:.95rem;margin:0 0 1.8rem;line-height:1.8}
  .grp{font-size:.74rem;font-weight:700;letter-spacing:.14em;color:var(--accent);
    margin:1.8rem 0 .7rem;padding-bottom:.4rem;border-bottom:1px solid var(--line)}
  .grp:first-of-type{margin-top:0}
  ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:.6rem}
  a.item{display:block;background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:1rem;text-decoration:none;color:var(--ink);font-weight:600;font-size:1rem}
  a.item:hover{border-color:var(--accent);color:var(--accent)}
  footer{margin-top:2.4rem;padding-top:1rem;border-top:1px solid var(--line);
    color:var(--faint);font-size:.82rem;line-height:1.75}
</style>
</head>
<body>
<div class="wrap"><div class="inner">
  <h1>週次インサイト</h1>

  </ul>
  <footer>要約は原文の主張をそのまま伝えるものではありません。判断の前に各出典をご確認ください。</footer>
</div></div>
</body>
</html>
